name: Render Remotion video

on:
  workflow_dispatch:
    inputs:
      template:
        description: Enter the exact folder name from src/templates (for example lifespan-globe)
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render ${{ inputs.template }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate template folder
        id: template
        env:
          REQUESTED_TEMPLATE: ${{ inputs.template }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readdirSync } from "node:fs";
          import { resolve } from "node:path";

          const root = resolve("src/templates");
          const validId = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
          const available = readdirSync(root, { withFileTypes: true })
            .filter((entry) => entry.isDirectory() && validId.test(entry.name))
            .filter((entry) =>
              existsSync(resolve(root, entry.name, "data.json")) &&
              existsSync(resolve(root, entry.name, "template.tsx"))
            )
            .map((entry) => entry.name)
            .sort();
          const requested = process.env.REQUESTED_TEMPLATE?.trim();

          if (!available.includes(requested)) {
            console.error(`Unknown template: ${requested || "(empty)"}`);
            console.error("Available templates:");
            for (const id of available) console.error(`- ${id}`);
            process.exit(1);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `id=${requested}\n`);
          console.log(`Selected template: ${requested}`);
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Generate template audio when configured
        shell: bash
        env:
          TEMPLATE_ID: ${{ steps.template.outputs.id }}
        run: |
          GENERATE_AUDIO=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync(`src/templates/${process.env.TEMPLATE_ID}/data.json`, "utf8"));
            if (Array.isArray(data.cues) && data.audio) {
              console.log("generate");
            } else {
              console.log("skip");
            }
          ')
          if [ "$GENERATE_AUDIO" = "generate" ]; then
            npm run audio:sfx -- "$TEMPLATE_ID"
          else
            echo "No generated SFX configured; using the template's existing audio or silence."
          fi

      - name: Render MP4
        env:
          TEMPLATE_ID: ${{ steps.template.outputs.id }}
        run: |
          mkdir -p out
          npm run render -- "$TEMPLATE_ID" "out/${TEMPLATE_ID}.mp4"

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.template.outputs.id }}-video
          path: out/${{ steps.template.outputs.id }}.mp4
          if-no-files-found: error
          retention-days: 14
